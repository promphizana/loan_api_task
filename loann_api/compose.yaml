services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/model/model.json
      DATABASE_URL: postgresql://loan:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/loans
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: loans
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
